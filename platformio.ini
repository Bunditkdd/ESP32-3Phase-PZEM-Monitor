; PlatformIO Project Configuration File
; ESP32-3Phase-PZEM-Monitor
; อัปเกรด: รองรับ WPA2-Enterprise (esp_wpa2 มาจาก ESP32 Arduino Framework)

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    mandulaj/PZEM-004T-v30 @ ^1.1.2
    knolleary/PubSubClient @ ^2.8
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.2
    ; ลบ WiFiManager ออกแล้ว เพราะ ConfigManager.h ใหม่ใช้ WebServer/DNSServer
    ; ที่มาพร้อม ESP32 Arduino Framework โดยไม่ต้องใช้ library ภายนอก

